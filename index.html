<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Love Story</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fbf7f2; --blush:#f4e6e4; --line:#e9d9d5; --wine:#5e1a30; --rose:#8e3b52; --petal:#e9b8c0;
  --gold:#a98a4c; --ink:#2e1a20; --muted:#85696f; --glass:rgba(255,255,255,.62);
  --serif:'Playfair Display',Georgia,serif; --script:'Great Vibes',cursive; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--ivory);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
img,video{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg{display:block}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;background:var(--petal);top:-14vw;left:-10vw}
.bg i:nth-child(2){width:38vw;height:38vw;background:#ecd9a8;bottom:-12vw;right:-8vw;animation-delay:-8s;opacity:.4}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.12)}}

/* Navigasi */
.nav{position:sticky;top:14px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(980px,calc(100% - 28px));margin:14px auto 0;padding:8px 10px 8px 24px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(94,26,48,.08)}
.brand{font-family:var(--script);font-size:1.7rem;line-height:1;color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tabs{display:flex;gap:4px}
.tabs button{padding:8px 20px;border-radius:99px;font-size:.95rem;color:var(--wine);transition:.3s}
.tabs button:hover{background:var(--blush)}
.tabs button.on{background:var(--wine);color:#fff}
.switch{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:.88rem;color:var(--muted)}
.switch i{width:34px;height:19px;border-radius:99px;border:1px solid var(--gold);position:relative;transition:.3s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--gold);transition:.3s}
.edit .switch{color:var(--wine)}
.edit .switch i{background:var(--wine);border-color:var(--wine)}
.edit .switch i::after{left:17px;background:#fff}

/* Halaman */
.page{display:none;max-width:1040px;margin:auto;padding:0 6vw}
.page.active{display:block;animation:pageIn .7s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Beranda */
.hero{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:9vh 0 6vh}
.hero h1{font-family:var(--script);font-weight:400;font-size:clamp(3.8rem,12vw,8rem);color:var(--wine);line-height:1.1}
.hero .quote{font-family:var(--serif);font-style:italic;font-size:clamp(1rem,2.2vw,1.25rem);color:var(--muted);max-width:36ch;margin:10px auto 0}
.count-label{font-family:var(--serif);color:var(--rose);margin:44px 0 18px}
.count{display:flex;justify-content:center;gap:clamp(8px,2vw,16px)}
.count div{min-width:clamp(66px,17vw,104px);padding:16px 6px 12px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(94,26,48,.07)}
.count b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1;color:var(--wine);font-variant-numeric:lining-nums tabular-nums}
.count span{font-size:.82rem;color:var(--muted);letter-spacing:.05em}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:40px}
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding-bottom:9vh}
.entry{text-align:left;padding:28px;border-radius:24px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(94,26,48,.06);transition:transform .4s,box-shadow .4s}
.entry:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(94,26,48,.13)}
.entry b{display:block;font-family:var(--serif);font-weight:400;font-size:3rem;line-height:1;color:var(--wine)}
.entry span{display:block;margin:6px 0 18px;color:var(--muted)}
.entry em{font-style:normal;color:var(--gold);border-bottom:1px solid var(--gold)}

/* Halaman isi */
.top{padding:8vh 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:40px}
.head h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);color:var(--wine);line-height:1.15}
.head p{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 26px;border-radius:99px;background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;font-size:.95rem;letter-spacing:.02em;box-shadow:0 6px 18px rgba(94,26,48,.22);transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(94,26,48,.28)}
.btn.ghost{background:var(--glass);color:var(--wine);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:#fff;box-shadow:0 6px 16px rgba(94,26,48,.1)}
.btn.small{padding:5px 16px;font-size:.85rem;box-shadow:none}
.btn.danger{background:transparent;color:#8c2040;border:1px solid var(--line);box-shadow:none}
.btn.danger:hover{border-color:#8c2040;background:#fff}
.admin{display:none!important}
.edit .admin{display:inline-flex!important}
.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px;font-family:var(--serif);font-style:italic}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:64px;padding:26px 0 8vh;border-top:1px solid var(--line)}

/* Cerita */
.timeline{position:relative}
.timeline::before{content:"";position:absolute;left:104px;top:10px;bottom:10px;width:1px;background:var(--line)}
.story{position:relative;display:grid;grid-template-columns:92px 1fr;gap:38px;margin-bottom:22px;animation:fade .6s ease both}
.story::before{content:"";position:absolute;left:100px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold)}
.when{text-align:right;padding-top:6px}
.when b{display:block;font-family:var(--serif);font-weight:400;font-size:2.6rem;line-height:1;color:var(--wine)}
.when span{font-size:.85rem;color:var(--gold);letter-spacing:.04em}
.what{padding:22px 26px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 26px rgba(94,26,48,.06)}
.what h3{font-family:var(--serif);font-weight:400;color:var(--wine);font-size:1.4rem;line-height:1.3;margin-bottom:6px}
.what p{white-space:pre-line;max-width:60ch}
.actions{gap:8px;margin-top:14px}

/* Galeri */
.gallery{columns:3 240px;column-gap:16px}
.item{position:relative;overflow:hidden;background:var(--blush);border-radius:18px;margin-bottom:16px;break-inside:avoid;cursor:zoom-in;box-shadow:0 8px 24px rgba(94,26,48,.1)}
.item img,.item video{width:100%;height:auto;transition:transform .8s ease}
.item:hover img,.item:hover video{transform:scale(1.05)}
.item .cap{position:absolute;inset:auto 0 0;padding:36px 18px 14px;color:#fff;font-family:var(--serif);font-style:italic;font-size:.95rem;background:linear-gradient(transparent,rgba(46,26,32,.72));opacity:0;transition:opacity .4s}
.item:hover .cap,.item:focus-visible .cap{opacity:1}
.item .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:1px solid #fff;color:#fff;display:grid;place-items:center;background:rgba(46,26,32,.35);backdrop-filter:blur(4px)}
.item .del{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.94)}

/* Lightbox & Modal */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(36,14,22,.86);backdrop-filter:blur(4px)}
.overlay.open{display:grid;animation:fade .35s}
.lb{max-width:960px;width:100%;text-align:center;color:#fff}
.lb img,.lb video{max-height:78vh;margin:auto;border-radius:12px}
.lb iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.lb p{font-family:var(--serif);font-style:italic;margin-top:14px;font-size:1.05rem}
.x{position:absolute;top:14px;right:22px;font-size:2rem;font-weight:300;color:#fff;line-height:1}
.modal{width:100%;max-width:460px;background:var(--ivory);padding:32px;border-radius:24px;max-height:92vh;overflow:auto;animation:pageIn .4s ease}
.modal h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;color:var(--wine);padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
label{display:block;margin-top:16px;font-size:.88rem;color:var(--muted)}
input,textarea{width:100%;padding:11px 14px;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

/* Musik */
.player{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:12px;max-width:min(300px,calc(100vw - 40px));padding:8px 20px 8px 8px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(94,26,48,.15)}
.disc{flex:none;width:40px;height:40px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;transition:background .3s}
.disc:hover{background:var(--rose)}
.player .t{min-width:0;font-size:.85rem;line-height:1.35}
.player .t b{display:block;font-family:var(--serif);font-weight:400;color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .t small{color:var(--muted)}
.player .cfg{font-size:.8rem;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.playing .t small::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--rose);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}

footer{text-align:center;padding:20px 20px 120px;color:var(--muted);font-family:var(--serif);font-style:italic}

@media (max-width:640px){
  .brand{display:none}.nav{padding-left:10px;justify-content:space-between}.switch span{display:none}.tabs button{padding:8px 14px}
  .timeline::before,.story::before{display:none}.story{grid-template-columns:1fr;gap:8px}.when{text-align:left;display:flex;align-items:baseline;gap:8px}.when b{font-size:1.8rem}
  .pager .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i></div>

<nav class="nav" aria-label="Navigasi utama">
  <button class="brand" id="brand" data-go="home">Our Love Story</button>
  <div class="tabs">
    <button data-go="home">Beranda</button>
    <button data-go="stories">Cerita</button>
    <button data-go="gallery">Galeri</button>
  </div>
  <button class="switch" id="editToggle" aria-pressed="false"><span>Mode Edit</span><i></i></button>
</nav>

<main>
  <!-- Halaman 1: Beranda -->
  <section class="page" id="page-home">
    <div class="hero">
      <h1 id="title">Our Love Story</h1>
      <p class="quote" id="quote"></p>
      <p class="count-label" id="countLabel"></p>
      <div class="count" id="count">
        <div><b id="cD">0</b><span>hari</span></div>
        <div><b id="cH">0</b><span>jam</span></div>
        <div><b id="cM">0</b><span>menit</span></div>
        <div><b id="cS">0</b><span>detik</span></div>
      </div>
      <div class="cta">
        <button class="btn" data-go="stories">Mulai dari Cerita Kami <span>→</span></button>
        <button class="btn ghost" data-go="gallery">Buka Galeri</button>
        <button class="btn ghost small admin" id="editHero">Ubah judul &amp; tanggal</button>
      </div>
    </div>
    <div class="entries">
      <button class="entry" data-go="stories"><b id="statStories">0</b><span>momen dalam perjalanan kami</span><em>Buka halaman Cerita</em></button>
      <button class="entry" data-go="gallery"><b id="statMedia">0</b><span>foto dan video kenangan</span><em>Buka halaman Galeri</em></button>
    </div>
  </section>

  <!-- Halaman 2: Cerita -->
  <section class="page" id="page-stories">
    <div class="top">
      <div class="head">
        <div><h2>Our Stories</h2><p>Setiap momen yang membawa kita sampai di sini.</p></div>
        <button class="btn admin" id="addStory">Tambah Cerita Baru</button>
      </div>
      <div class="timeline" id="storyList"></div>
      <div class="pager">
        <button class="btn ghost" data-go="home">← Beranda</button>
        <button class="btn" data-go="gallery">Lanjut ke Galeri →</button>
      </div>
    </div>
  </section>

  <!-- Halaman 3: Galeri -->
  <section class="page" id="page-gallery">
    <div class="top">
      <div class="head">
        <div><h2>Galeri Kenangan</h2><p>Foto dan video yang kami simpan.</p></div>
        <button class="btn admin" id="addMedia">Tambah Media Baru</button>
      </div>
      <div class="gallery" id="mediaList"></div>
      <div class="pager">
        <button class="btn ghost" data-go="stories">← Kembali ke Cerita</button>
        <button class="btn" data-go="home">Kembali ke Beranda</button>
      </div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<!-- Pemutar musik -->
<div class="player" id="player">
  <button class="disc" id="playBtn" aria-label="Putar atau jeda musik"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  <div class="t"><b id="songTitle">Lagu Kita</b><small id="songState">Ketuk untuk memutar</small></div>
  <button class="cfg admin" id="editSong" aria-label="Ubah lagu">Ubah</button>
  <audio id="audio" loop preload="none"></audio>
</div>

<!-- Lightbox -->
<div class="overlay" id="lightbox"><button class="x" id="lbClose" aria-label="Tutup">×</button><div class="lb" id="lbBody"></div></div>

<!-- Modal generik -->
<div class="overlay" id="modalWrap"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
/* ========= Penyimpanan ========= */
const KEY = 'ourLoveStory.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const inThirtyDays = () => new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);

const defaults = () => ({
  settings: {
    title: 'Our Love Story',
    quote: 'Di antara jutaan hari, aku memilih menghabiskannya bersamamu.',
    date: inThirtyDays(),
    dateLabel: 'Hari istimewa kita',
    song: { title: 'Lagu Kita', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' }
  },
  stories: [
    { id: uid(), date: '2023-02-14', title: 'Pertemuan Pertama', text: 'Hari itu hujan, kita berteduh di tempat yang sama. Tidak ada yang tahu bahwa itu awal dari segalanya.' },
    { id: uid(), date: '2023-08-20', title: 'Kencan Pertama', text: 'Makan malam sederhana, tawa yang tidak berhenti, dan waktu yang terasa terlalu cepat.' }
  ],
  media: [
    { id: uid(), url: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800', caption: 'Tangan yang saling menggenggam' },
    { id: uid(), url: 'https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac?w=800', caption: 'Senja bersamamu' }
  ]
});

let db;
function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
  if (!db || !db.settings) { db = defaults(); save(); }
}
function save() {
  setTimeout(renderStats);
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('Penyimpanan penuh atau diblokir browser. Perubahan tidak tersimpan.'); }
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => { const dt = new Date(d + 'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); };

/* ========= Hero & Countdown ========= */
function renderHero() {
  const s = db.settings;
  $('title').textContent = s.title;
  $('quote').textContent = s.quote;
  document.title = s.title;
  $('footer').textContent = s.title;
  $('brand').textContent = s.title;
  tick();
}
function tick() {
  const s = db.settings, target = new Date(s.date + 'T00:00:00');
  if (isNaN(target)) return;
  let diff = target - Date.now();
  const past = diff < 0;
  $('countLabel').textContent = past ? `Sudah bersama sejak ${fmtDate(s.date)}` : `Menuju ${s.dateLabel || 'hari istimewa'}, ${fmtDate(s.date)}`;
  diff = Math.abs(diff);
  const p = n => String(n).padStart(2, '0');
  $('cD').textContent = Math.floor(diff / 864e5);
  $('cH').textContent = p(Math.floor(diff / 36e5) % 24);
  $('cM').textContent = p(Math.floor(diff / 6e4) % 60);
  $('cS').textContent = p(Math.floor(diff / 1e3) % 60);
}
setInterval(tick, 1000);

/* ========= Cerita ========= */
const dayNum = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? '' : t.getDate(); };
const monYear = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.toLocaleDateString('id-ID', { month: 'short', year: 'numeric' }); };
function renderStories() {
  const list = [...db.stories].sort((a, b) => a.date.localeCompare(b.date));
  $('storyList').innerHTML = list.length ? list.map(s => `
    <article class="story">
      <div class="when"><b>${esc(dayNum(s.date))}</b><span>${esc(monYear(s.date))}</span></div>
      <div class="what">
        <h3>${esc(s.title)}</h3>
        <p>${esc(s.text)}</p>
        <div class="actions admin">
          <button class="btn ghost small" data-edit-story="${s.id}">Edit</button>
          <button class="btn danger small" data-del-story="${s.id}">Hapus</button>
        </div>
      </div>
    </article>`).join('')
    : `<div class="empty">Belum ada cerita. Aktifkan Mode Edit lalu tambahkan momen pertama kalian.</div>`;
}
function storyForm(id) {
  const s = db.stories.find(x => x.id === id) || { date: '', title: '', text: '' };
  openModal(`
    <h3>${id ? 'Edit Cerita' : 'Cerita Baru'}</h3>
    <label>Tanggal<input type="date" id="fDate" value="${esc(s.date)}" required></label>
    <label>Judul momen<input id="fTitle" value="${esc(s.title)}" maxlength="80" required></label>
    <label>Kisah<textarea id="fText">${esc(s.text)}</textarea></label>
    <div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="fSave">Simpan cerita</button></div>`);
  $('fSave').onclick = () => {
    const date = $('fDate').value, title = $('fTitle').value.trim(), text = $('fText').value.trim();
    if (!date || !title) return alert('Tanggal dan judul wajib diisi.');
    if (id) Object.assign(db.stories.find(x => x.id === id), { date, title, text });
    else db.stories.push({ id: uid(), date, title, text });
    save(); renderStories(); closeModal();
  };
}
$('addStory').onclick = () => storyForm();
$('storyList').onclick = e => {
  const ed = e.target.closest('[data-edit-story]'), del = e.target.closest('[data-del-story]');
  if (ed) storyForm(ed.dataset.editStory);
  if (del && confirm('Hapus cerita ini?')) { db.stories = db.stories.filter(x => x.id !== del.dataset.delStory); save(); renderStories(); }
};

/* ========= Galeri ========= */
function parseMedia(url) {
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (yt) return { type: 'yt', id: yt[1] };
  if (/\.(mp4|webm|ogg)(\?|#|$)/i.test(url)) return { type: 'video' };
  return { type: 'img' };
}
function renderMedia() {
  $('mediaList').innerHTML = db.media.length ? db.media.map(m => {
    const k = parseMedia(m.url);
    const thumb = k.type === 'yt' ? `<img src="https://img.youtube.com/vi/${k.id}/hqdefault.jpg" alt="${esc(m.caption)}" loading="lazy">`
      : k.type === 'video' ? `<video src="${esc(m.url)}#t=0.5" muted preload="metadata"></video>`
      : `<img src="${esc(m.url)}" alt="${esc(m.caption)}" loading="lazy">`;
    return `<figure class="item" data-open="${m.id}" tabindex="0">${thumb}
      ${k.type !== 'img' ? '<span class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>' : ''}
      <figcaption class="cap">${esc(m.caption)}</figcaption>
      <button class="btn danger small del admin" data-del-media="${m.id}">Hapus</button></figure>`;
  }).join('') : `<div class="empty" style="column-span:all">Galeri masih kosong. Tambahkan foto atau video kenangan kalian.</div>`;
}
$('addMedia').onclick = () => {
  openModal(`
    <h3>Media Baru</h3>
    <label>URL foto / video / YouTube<input id="mUrl" placeholder="https://..." required></label>
    <p class="hint">Bisa link gambar (.jpg, .png), video (.mp4), atau tautan YouTube.</p>
    <label>Judul / keterangan<input id="mCap" maxlength="80"></label>
    <div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="mSave">Tambah ke galeri</button></div>`);
  $('mSave').onclick = () => {
    const url = $('mUrl').value.trim();
    if (!/^https?:\/\//i.test(url)) return alert('Masukkan URL lengkap yang diawali http:// atau https://');
    db.media.push({ id: uid(), url, caption: $('mCap').value.trim() });
    save(); renderMedia(); closeModal();
  };
};
function openLightbox(id) {
  const m = db.media.find(x => x.id === id); if (!m) return;
  const k = parseMedia(m.url);
  $('lbBody').innerHTML = (k.type === 'yt' ? `<iframe src="https://www.youtube.com/embed/${k.id}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`
    : k.type === 'video' ? `<video src="${esc(m.url)}" controls autoplay></video>`
    : `<img src="${esc(m.url)}" alt="${esc(m.caption)}">`) + (m.caption ? `<p>${esc(m.caption)}</p>` : '');
  $('lightbox').classList.add('open');
}
function closeLightbox() { $('lightbox').classList.remove('open'); $('lbBody').innerHTML = ''; }
$('mediaList').onclick = e => {
  const del = e.target.closest('[data-del-media]');
  if (del) { e.stopPropagation(); if (confirm('Hapus media ini?')) { db.media = db.media.filter(x => x.id !== del.dataset.delMedia); save(); renderMedia(); } return; }
  const it = e.target.closest('[data-open]'); if (it) openLightbox(it.dataset.open);
};
$('mediaList').onkeydown = e => { if (e.key === 'Enter') { const it = e.target.closest('[data-open]'); if (it) openLightbox(it.dataset.open); } };
$('lbClose').onclick = closeLightbox;
$('lightbox').onclick = e => { if (e.target === $('lightbox')) closeLightbox(); };

/* ========= Modal ========= */
function openModal(html) { $('modal').innerHTML = html; $('modalWrap').classList.add('open'); const f = $('modal').querySelector('input'); if (f) f.focus(); }
function closeModal() { $('modalWrap').classList.remove('open'); }
$('modalWrap').onclick = e => { if (e.target === $('modalWrap') || e.target.closest('[data-close]')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeLightbox(); } });

/* ========= Pengaturan hero ========= */
$('editHero').onclick = () => {
  const s = db.settings;
  openModal(`
    <h3>Ubah Halaman Utama</h3>
    <label>Judul utama<input id="hTitle" value="${esc(s.title)}" maxlength="60"></label>
    <label>Kutipan romantis<textarea id="hQuote" style="min-height:80px">${esc(s.quote)}</textarea></label>
    <label>Tanggal hitung mundur<input type="date" id="hDate" value="${esc(s.date)}"></label>
    <p class="hint">Tanggal di masa depan menghitung mundur; tanggal yang sudah lewat menghitung lamanya kalian bersama.</p>
    <label>Nama acara<input id="hLabel" value="${esc(s.dateLabel)}" maxlength="50" placeholder="mis. Hari pernikahan kita"></label>
    <div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="hSave">Simpan</button></div>`);
  $('hSave').onclick = () => {
    if (!$('hDate').value) return alert('Pilih tanggal terlebih dahulu.');
    Object.assign(db.settings, { title: $('hTitle').value.trim() || 'Our Love Story', quote: $('hQuote').value.trim(), date: $('hDate').value, dateLabel: $('hLabel').value.trim() });
    save(); renderHero(); closeModal();
  };
};

/* ========= Musik ========= */
const audio = $('audio');
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
function setSong() { audio.src = db.settings.song.url; $('songTitle').textContent = db.settings.song.title || 'Lagu Kita'; }
function setPlaying(on) {
  $('player').classList.toggle('playing', on);
  $('playBtn').innerHTML = on ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' : PLAY_ICON;
  $('songState').textContent = on ? 'Sedang diputar' : 'Ketuk untuk memutar';
}
$('playBtn').onclick = () => {
  if (audio.paused) audio.play().then(() => setPlaying(true)).catch(() => { setPlaying(false); alert('Lagu tidak bisa diputar. Periksa URL audio di Mode Edit.'); });
  else { audio.pause(); setPlaying(false); }
};
audio.onerror = () => { if (audio.src) { setPlaying(false); $('songState').textContent = 'Audio gagal dimuat'; } };
$('editSong').onclick = () => {
  const sg = db.settings.song;
  openModal(`
    <h3>Ubah Lagu</h3>
    <label>Judul lagu<input id="sTitle" value="${esc(sg.title)}" maxlength="60"></label>
    <label>URL file audio (.mp3)<input id="sUrl" value="${esc(sg.url)}"></label>
    <p class="hint">Gunakan tautan langsung ke file audio. Link YouTube atau Spotify tidak bisa diputar di sini.</p>
    <div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="sSave">Simpan lagu</button></div>`);
  $('sSave').onclick = () => {
    const url = $('sUrl').value.trim();
    if (!/^https?:\/\//i.test(url)) return alert('Masukkan URL audio yang valid.');
    audio.pause(); setPlaying(false);
    db.settings.song = { title: $('sTitle').value.trim(), url };
    save(); setSong(); closeModal();
  };
};

/* ========= Mode Edit ========= */
function setEdit(on) {
  document.body.classList.toggle('edit', on);
  $('editToggle').setAttribute('aria-pressed', on);
  try { localStorage.setItem(KEY + '.edit', on ? '1' : '0'); } catch (e) {}
}
$('editToggle').onclick = () => setEdit(!document.body.classList.contains('edit'));

/* ========= Navigasi halaman ========= */
const PAGES = ['home', 'stories', 'gallery'];
const PAGE_TITLE = { home: '', stories: ' · Cerita', gallery: ' · Galeri' };
function show(name) {
  if (!PAGES.includes(name)) name = 'home';
  PAGES.forEach(p => $('page-' + p).classList.toggle('active', p === name));
  document.querySelectorAll('.tabs [data-go]').forEach(b => {
    const on = b.dataset.go === name;
    b.classList.toggle('on', on);
    on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  document.title = db.settings.title + PAGE_TITLE[name];
  window.scrollTo({ top: 0 });
}
function go(name) { if (location.hash === '#/' + name) show(name); else location.hash = '#/' + name; }
window.addEventListener('hashchange', () => show(location.hash.replace('#/', '')));
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
function renderStats() { $('statStories').textContent = db.stories.length; $('statMedia').textContent = db.media.length; }

/* ========= Mulai ========= */
load(); setSong(); renderHero(); renderStories(); renderMedia(); renderStats(); show(location.hash.replace('#/', ''));
try { if (localStorage.getItem(KEY + '.edit') === '1') setEdit(true); } catch (e) {}
</script>
</body>
</html>
